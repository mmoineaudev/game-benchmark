<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeon Crawler — Visual Showcase</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { overflow: hidden; background: #0a0a15; width: 100%; height: 100%; }
      #app { width: 100%; height: 100%; }
      #hud {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; font-family: monospace; color: #ccc; z-index: 10;
      }
      #crosshair {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5);
      }
      #orb-count {
        position: absolute; top: 16px; left: 16px;
        background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 4px;
        font-size: 14px;
      }
      #prompt {
        position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
        color: #888; font-size: 14px; text-align: center;
      }
      #interact-prompt {
        position: absolute; bottom: 25%; left: 50%; transform: translateX(-50%);
        color: #ffaa44; font-size: 13px; display: none;
      }
      #exit-prompt {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        color: #ffaa00; font-size: 16px; display: none;
        background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 4px;
      }
      #hint {
        position: absolute; bottom: 10px; right: 10px;
        color: #444; font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="orb-count">Orbs: 0/0</div>
      <div id="prompt">Click to explore</div>
      <div id="interact-prompt">[E] Collect</div>
      <div id="exit-prompt">The depths beckon further... [E] to descend</div>
      <div id="hint">WASD move · Mouse look · E collect · P toggle bloom</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
